# 2025 ASUS ROG Flow Z13 (GZ302 series, Strix Halo).
#
# Every number here is measured or verified on hardware; sources are noted per
# block. While internal/cli still carries these values as constants, the test
# suite pins this file against them (TestZ13FileMatchesCliConstants) — change
# both together until the constants are deleted.

[device]
id    = "asus-rog-flow-z13-2025"
model = "GZ302"

# product_name carries the SKU twice ("ROG Flow Z13 GZ302EA_GZ302EA"), so the
# prefix form covers every GZ302 variant.
[[device.match]]
vendor         = "ASUSTeK COMPUTER INC."
product_prefix = "ROG Flow Z13 GZ302"

# Two hwmon devices under asus-nb-wmi; both fans cool the same APU, so one
# curve always drives both. Temperature axis is the curve editor's.
[fans]
method   = "asus-nb-wmi"
points   = 8
temp_min = 35
temp_max = 105

# A suspend that starts straight after the daemon's pre-sleep fan release
# (pwm_enable=2) is often woken by the EC 1–2.5 s into s2idle — SCI and IRQ 1
# together, then "Wakeup after ACPI Notify sync" — and a lid-closed machine then
# cycles through sleep and wake (issue #24). RTC-timed 20 s suspends, 2026-10-09:
# 7 of 15 woke early with no hold, 4 of 6 with 300 ms, 0 of 7 with 3 s, and 0 of
# 10 with no release at all.
sleep_release_settle_ms = 3000

# The kernel labels these cpu_fan and gpu_fan, a naming asus-wmi uses across the
# range; on the Z13 both fans cool the one APU and there is no discrete GPU, so
# the labels would describe hardware the machine does not have.
labels = ["Fan 1", "Fan 2"]

# Top speed, measured (2026-10-09): every curve point at 255 on both channels
# with pwm_enable=1 plateaus at 8600–8900 RPM on both fans after ~40 s of EC
# ramp; pwm1_enable=0 on the base device reached the same 8900 on fan 1. hwmon
# publishes no fan*_max, so this is the dashboard's fan axis hint only.
rpm_max = 8900

# Named starting points, offered only when the user picks one — never applied by
# a profile switch. That coupling is what the z13ctl-plus fork shipped and then
# deleted: its Quiet profile auto-applied a quiet curve, and any curve with a
# non-zero bottom defeats the firmware's zero-RPM idle, so selecting Quiet made
# the machine audible where firmware auto had been silent.
#
# Unlike every other block in this file these curves are *starting points*, not
# measurements — the user drags them from here. Two facts about this machine do
# constrain them, and both are load-bearing:
#
#   - Zero-RPM idle survives only while the low points are 0. "quiet" and
#     "balanced" hold 0 across the idle range for that reason; a nominally
#     gentle curve that starts at 15% is louder at idle than firmware auto.
#   - "turbo" is the one preset that already satisfies power.floor_curve at
#     every point, so raising the sustained limit past tdp_max_safe leaves it
#     exactly as drawn. The others are below the floor at low temperatures and
#     the daemon raises them there — correctly, and visibly.
[[fans.presets]]
name        = "quiet"
label       = "Quiet"
description = "Fans stopped until 60°C, then a late ramp. Quietest option; lets the package run hot."
curve       = [[35, 0], [50, 0], [60, 0], [70, 60], [80, 110], [90, 170], [95, 215], [105, 255]]

[[fans.presets]]
name        = "balanced"
label       = "Balanced"
description = "Silent at idle, ramping from 55°C. A middle ground between Quiet and Turbo."
curve       = [[35, 0], [45, 0], [55, 55], [65, 90], [75, 130], [85, 180], [95, 225], [105, 255]]

[[fans.presets]]
name        = "turbo"
label       = "Turbo"
description = "Fans always running, full speed by 85°C. Audible at idle, and the only preset ready for TDP above the safe maximum."
curve       = [[35, 127], [45, 140], [55, 165], [65, 190], [75, 235], [85, 255], [95, 255], [105, 255]]

# PPT limits via the asus-nb-wmi platform device attributes (NOT
# firmware-attributes, whose calibration data is empty on this machine).
# Limits are G-Helper's for the GZ302E. The floor curve is what the fans must
# hold while sustained TDP exceeds tdp_max_safe: 50% at idle temperatures,
# full speed by 80°C — the ramp is what protects the APU, the bottom is what
# keeps it quiet.
[power]
method         = "asus-nb-wmi-ppt"
tdp_min        = 5
tdp_max_safe   = 75
tdp_max_forced = 93
tdp_default    = 50
floor_curve    = [[30, 127], [40, 127], [50, 140], [60, 165], [65, 190], [70, 215], [75, 235], [80, 255]]

# Measured with ryzenadj. Only PL1 matches what the firmware enforces — under
# load the balanced row ran 63–66 W against the firmware's own 52 W — so a row
# is written first (it lowers a high custom limit and replaces the kernel's
# stale 5W boot cache) and is always followed by the fan release that makes the
# firmware re-apply its own limits. APU/Platform sPPT are 70 across all three
# profiles while PL2 varies — write these rows verbatim, never mirror.
[power.stock_ppt]
quiet       = { pl1 = 40, pl2 = 55, fppt = 55, apu = 70, platform = 70 }
balanced    = { pl1 = 52, pl2 = 71, fppt = 70, apu = 70, platform = 70 }
performance = { pl1 = 70, pl2 = 86, fppt = 86, apu = 70, platform = 70 }

# The kernel lists what each handler offers (choices); names filters and orders
# it. Two handlers register here: asus-wmi (quiet balanced performance) owns the
# profile, and amd-pmf (low-power balanced performance) follows it — the driver
# writes amd-pmf "low-power" for "quiet". default is where tdp --reset and
# tuning --reset land; its stock PL1 must be within tdp_max_safe.
[profiles]
method  = "platform-profile"
names   = ["quiet", "balanced", "performance"]
handler = "asus-wmi"
default = "balanced"

# Aura HID: keyboard 0b05:1a30 (detachable — powers off when removed),
# lightbar 0b05:18c6. Both zones are always addressed; each device ignores the
# other zone's packets.
[lighting]
method = "aura-hid"
zones  = ["keyboard", "lightbar"]

# asus-armoury firmware-attributes (mainline since Linux 6.19).
[toggles]
method = "asus-armoury"

[[toggles.entries]]
id          = "boot_sound"
label       = "POST boot sound"
description = "Play startup sound when the laptop powers on"

# The ghosting note is the reason descriptions are device data rather than UI
# prose: whether overdrive ghosts is a fact about this panel, and a client
# rendering toggle rows generically cannot know it.
[[toggles.entries]]
id          = "panel_overdrive"
label       = "Panel overdrive"
description = "Faster pixel response for the display (may cause ghosting)"

# The ACPI battery reports energy_full / energy_full_design (µWh), not the
# charge_* (µAh) pair — hence state of health is served as a ratio.
#
# The charge-limit range is declared because the kernel cannot say:
# charge_control_end_threshold has no min/max attribute beside it.
[battery]
method           = "power-supply"
health           = true
charge_limit_min = 40
charge_limit_max = 100
# No charger key: the generic power_supply view (a System-scope ucsi supply
# online means USB-C) matched asus-armoury's charge_mode on both inputs here —
# adapter 1/adapter, USB-C 2/usb-c (2026-10-09) — without charge_mode's live
# WMI read on every battery poll.

# cpufreq's global boost switch (/sys/devices/system/cpu/cpufreq/boost). Writing
# it moves every policy at once: measured here, 0 drops scaling_max_freq from
# 5187500 to 3000000 across all 33 policies and 1 restores it. udev cannot see
# the path — it is a plain kobject, not a device — so the group-write grant comes
# from voltaire-perms.service rather than a rule.
[cpu]
boost = "cpufreq"

# CPU Curve Optimizer via ryzen_smu (amkillam fork required on Strix Halo);
# iGPU CO is unsupported on this silicon.
[undervolt]
method = "ryzen-smu-co"
min    = -40
max    = 0

# APU temperature and both fan speeds from hwmon; package power from the
# powercap RAPL energy counter (intel-rapl:0, name "package-0"); battery flow
# from power_supply. energy_uj is 0400 root:root under the Platypus mitigation,
# so package power appears only after "voltaire setup" has granted the group
# read access — a machine without it reports no package power and the dashboard
# draws no power chart, rather than a line flat at zero. Declaring a source here
# that Sample() does not read is the failure this block used to describe: the
# graph would be flat at zero, which reads as a measurement.
[telemetry]
method          = "hwmon-rapl"
power_draw      = "rapl"
# Expanded sources, each named only because the driver reads it (the
# declaration guard holds both directions): the amdgpu iGPU (edge temp, busy
# %, sclk, GFX power and UCLK from gpu_metrics, VRAM carveout), procfs/cpufreq
# CPU stats (utilisation counters, average core clock, system memory), the
# amdxdna NPU (power, utilisation, clock — read only while runtime-active),
# and the physical interfaces' byte counters from /proc/net/dev (summed over
# interfaces with a /sys/class/net/*/device link, so tunnels and bridges do
# not double-count).
gpu             = "amdgpu"
cpu_stats       = "procfs"
npu             = "amdxdna"
net             = "procfs"
# One hour at the sampler's 1 Hz: ~1 MiB of ring, and the longest window the
# dashboard offers. See device.DefaultHistorySeconds for what bounds it (the
# client's 4 MiB reply ceiling, not memory).
history_seconds = 3600

# The Armoury Crate button: KEY_PROG3 on the "Asus WMI hotkeys" input device
# (older ASUS models use KEY_PROG1). The same node carries SW_TABLET_MODE —
# never grab it exclusively (issue #10).
[button]
method  = "evdev-key"
device  = "Asus WMI hotkeys"
keycode = 202
kind    = "armoury-crate"
