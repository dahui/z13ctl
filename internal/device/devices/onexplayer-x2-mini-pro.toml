# OneXPlayer X2 Mini Pro (Strix Halo). Power limits and undervolt through
# ryzen_smu, profiles (pinned), battery, CPU boost, telemetry and buttons. Fan control is
# left to the EC's own curve (.claude/plans/oxp-power.md).
#
# Every value here was captured on this machine (2026-11-17, Linux 7.3.4,
# hid-oxp bound); the captures are in
# .claude/plans/fixtures/oxp-inputplumber-2026-11-17/. The format is
# documented key by key in website/docs/dev/device-files.md.

[device]
id    = "onexplayer-x2-mini-pro"
model = "X2 Mini Pro"
name  = "OneXPlayer X2 Mini Pro"

[[device.match]]
vendor  = "ONE-NETBOOK"
product = "ONEXPLAYER X2Mini PRO"

# amd-pmf is the only platform-profile handler (no vendor WMI), and it is
# pinned to balanced: low-power caps power at ~33 W below any SMU limit, and
# the PM table cannot show it (measured 2026-11-17: SMU 60/60/60 on low-power
# held 32.8 W). Balanced does not cap: SMU 85 held the same 62–65 W at 95 °C
# on balanced and performance, the chassis's thermal ceiling. OneXConsole has
# no profiles either, only a TDP slider, so while the slider exists none is
# offered: the daemon holds balanced and puts it back (logged) when anything
# else selects another.
#
# Without ryzen_smu there is no slider (the power method is unavailable and
# says why), and the pin is dropped: the three amd-pmf profiles are then the
# only power control, measured 2026-11-16 under load at about 33 W
# (low-power), 61 W (balanced) and 61 W (performance; the thermal ceiling).
[profiles]
method  = "platform-profile"
names   = ["low-power", "balanced", "performance"]
handler = "amd-pmf"
default = "balanced"
pin     = "balanced"

# STAPM (PL1), slow (PL2) and fast (PL3) PPT over the SMU, ryzenadj's MP1
# 0x14/0x16/0x15, which needs the ryzen_smu module (amkillam's fork for Strix
# Halo; it loads by PCI alias once installed). The range is OneXConsole's:
# 10–85 W on AC, at most 55 W on battery. Nothing above it is offered, so no
# fan floor is needed and the safe maximum is the range maximum — the EC keeps
# its own fan curve, and sustained power is thermally bound near 62 W anyway.
#
# The stock rows are the EC's own presets (THMD(2) on AC, THMD(1) on battery;
# STAPM/slow/fast), which it writes on every charger edge whatever was set —
# measured, so the daemon re-applies the remembered TDP after each edge.
# There is no "restore defaults" SMU message; a reset writes these rows.
#
# slider: like OneXConsole, setting a TDP with no custom profile active is a
# remembered device setting, re-applied at boot, on resume and after a charger
# edge, never written until the user first sets one.
[power]
method          = "amd-smu"
tdp_min         = 10
tdp_max_safe    = 85
tdp_max_forced  = 85
tdp_max_battery = 55
slider          = true

[[power.limits]]
id          = "pl1"
label       = "Sustained (STAPM)"
description = "The long-term average the chip is held to"

[[power.limits]]
id          = "pl2"
label       = "Slow PPT"
description = "The limit over the next tens of seconds"

[[power.limits]]
id          = "pl3"
label       = "Fast PPT"
description = "The short boost limit"

[power.stock_ppt]
balanced = { pl1 = 80, pl2 = 85, fppt = 100 }

[power.stock_ppt_battery]
balanced = { pl1 = 50, pl2 = 50, fppt = 60 }

# The charge limit is deliberately not offered yet. oxpec (7.3, 7.4) exposes
# BATT/charge_control_end_threshold and charge_behaviour on this board but
# writes them to the OneXPlayer X1's EC registers (0xA3/0xA4), which this EC
# ignores: the pack charged to 96 % with the threshold at 62. It reads the
# APEX's (0xE5/0xE6, same system board): with oxpec built to use those, the
# threshold and the bypass both stopped and resumed charging within seconds,
# on BIOS 0.22 and 0.25 alike (2026-11-17/18). The one-line kernel fix was
# sent to platform-driver-x86 on 2026-11-17. Turn this on gated by kernel
# version once a release carries it: sysfs reads the same with either
# driver, and a functional probe would have to stop the user's charging.
#
# This EC reports `status` "Charging" whether or not current flows (it read
# Charging at 96 % over a 62 % limit with power_now 0; 42 W when really
# charging), so a Charging read is checked against the flow.
[battery]
method              = "power-supply"
health              = true
charge_limit        = false
charging_needs_flow = true

[cpu]
boost = "cpufreq"

# CPU Curve Optimizer via ryzen_smu, the same module and command as the Z13
# (Strix Halo, MP1 0x4C; amkillam's fork). On this slider device it is a
# device setting like the TDP: a bare undervolt command is remembered and runs
# whenever no custom profile carries an offset of its own (State.DeviceUndervolt),
# so moving the TDP slider does not drop it. The range is the Z13's.
[undervolt]
method = "ryzen-smu-co"
min    = -40
max    = 0

# Strix Halo, like the Z13: package power from RAPL (granted by voltaire
# setup), the APU temperature from k10temp, the iGPU from amdgpu. The NPU is
# declared but absent while amdxdna cannot probe, which it cannot under
# amd_iommu=off (required for suspend on this BIOS); the daemon offers only
# what is present. No fan RPM until the fans block lands.
[telemetry]
method          = "hwmon-rapl"
power_draw      = "rapl"
gpu             = "amdgpu"
cpu_stats       = "procfs"
npu             = "amdxdna"
net             = "procfs"
# Fan speed, read only: oxp_ec's fan1_input (world-readable; 2597 RPM at idle
# on AC, 2026-11-17). Its pwm1 takes a fixed duty and has no curve, so voltaire
# leaves the fan on the EC's own curve and declares no [fans] section.
fans            = "oxp_ec"
history_seconds = 3600

# The three buttons above the screen. None of them is an ordinary input event
# of its own: the controller (1a86:fe00) sends two as key chords on its
# interface-0 keyboard node and the third as a vendor HID frame on interface 2.
#
# The chords: the firmware presses the modifiers, then the last key, and
# releases in reverse. The Keyboard button's chord is a fixed ~20 ms pulse
# however long the button is held (a long press switches the controller to
# mouse mode inside the firmware, invisible to the host). The OneXPlayer
# button's chord is held for as long as the button is.
#
# The node is "HID 1a86:fe00" on interface 0. Interface 1 registers a node
# with the same name (mouse and consumer keys) that sysfs lists first, so the
# USB interface is named too. udev classes interface 0 as a typing keyboard
# (ID_INPUT_KEYBOARD=1) because its descriptor is a boot keyboard; what it
# actually sends is only these chords, which is what keyboard_node records.
#
# When InputPlumber manages the controller (it auto-starts once installed) it
# grabs this node and the hidraw interfaces, and the buttons reach voltaire
# only through it: inputplumber names each button's capability in
# InputPlumber 0.84.0's oxp9 map, confirmed by mapping each to a DBus action on
# this machine (2026-11-17). Its default profile sends QuickAccess2 to
# Screenshot and Keyboard to Guide+North (Steam's on-screen keyboard), and
# passes QuickAccess (Steam's Quick Access menu) through.
[[buttons]]
id            = "keyboard"
label         = "Keyboard button"
default       = true
method        = "evdev-chord"
device        = "HID 1a86:fe00"
usb           = "1a86:fe00"
interface     = 0
keys          = [29, 125, 24] # KEY_LEFTCTRL, KEY_LEFTMETA, KEY_O
inputplumber  = "QuickAccess2"
keyboard_node = "the X2 Mini Pro controller's interface-0 keyboard sends only the button chords"

[[buttons]]
id            = "oxp"
label         = "OneXPlayer button"
method        = "evdev-chord"
device        = "HID 1a86:fe00"
usb           = "1a86:fe00"
interface     = 0
keys          = [29, 125, 56] # KEY_LEFTCTRL, KEY_LEFTMETA, KEY_LEFTALT
inputplumber  = "QuickAccess"
keyboard_node = "the X2 Mini Pro controller's interface-0 keyboard sends only the button chords"

# Home: a 64-byte unnumbered B2 frame on the controller's vendor interface,
# button id 0x24 at byte 6 and its state at byte 12 (01 press, 02 release).
# The two frames of a tap differ only in that byte, so it is part of the
# match, or one tap would count as a double press. Reports on 7.3.4 without
# the onexplayer-x2mini watcher (on 7.2 hid-oxp's button map silenced it).
# InputPlumber's oxp_hid driver calls button 0x24 "Keyboard" (it was written
# for the OXP X1).
[[buttons]]
id           = "home"
label        = "Home button"
method       = "hidraw-report"
usb          = "1a86:fe00"
interface    = 2
report_id    = 0xb2
match        = [[6, 0x24], [12, 0x01]]
inputplumber = "Keyboard"

# The controller's vibration strength: hid-oxp's rumble_intensity on its
# vendor interface (0003:1A86:FE00.*), 0–5 from rumble_intensity_range.
# Checked 2026-11-17: 5, 1, 5, 1 between identical rumble effects were felt
# as strong, weak, strong, weak, so the X2 obeys it.
[rumble]
method = "hid-oxp"
usb    = "1a86:fe00"

# The drawer a user who has not customized it gets: Jeff's own arrangement on
# this machine (2026-11-17). The TDP slider and CPU boost, the screen's
# brightness, the volume and the controller's vibration strength, then the
# refresh rate. The saved-profile picker and autoswitch are left to Settings →
# Quickbar: on a one-slider device the slider is the power control. RGB is
# listed for when the joystick rings have a lighting driver; a control the
# device cannot offer is dropped until then. On 7.3.4 hid-oxp registers
# oxp:rgb:joystick_rings but the controller ignores its writes (checked
# 2026-11-17: effect and speed writes return success and read back unchanged,
# with or without InputPlumber running). The X2 controllers use a newer RGB
# protocol, which only the unmerged hid-oxp X2-family series speaks.
[quickbar]
controls = ["tdp", "cpu-boost", "brightness", "volume", "rumble", "refresh-rate", "lighting"]
