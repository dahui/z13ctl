version: 2

project_name: voltaire

# The api submodule is tagged api/vX.Y.Z in this same repository, and those tags
# land on commits well after the last main-module release. Without this filter
# goreleaser treats the newest api/* tag as the previous release and generates
# the changelog from that point — for v1.2.1 that meant a single commit instead
# of the whole bugfix series, silently truncating the GitHub release body.
#
# Verified by building v1.2.1 both ways in a scratch clone: 1 commit without,
# the full series with. Note it does NOT affect --snapshot versioning, which
# still derives from a plain `git describe`; the Makefile filters tags itself
# for the same reason.
git:
  ignore_tags:
    - "api/*"

before:
  hooks:
    - go mod tidy

builds:
  - id: voltaire
    binary: voltaire
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/dahui/voltaire/v2/internal/version.Version={{.Version}}
    goos:
      - linux
    goarch:
      - amd64
  - id: voltaire-gui
    binary: voltaire-gui
    main: ./voltaire-gui
    env:
      - CGO_ENABLED=1
    ldflags:
      - -s -w -X github.com/dahui/voltaire/v2/internal/version.Version={{.Version}}
    goos:
      - linux
    goarch:
      - amd64

archives:
  - id: voltaire
    ids: [voltaire]
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - contrib/systemd/**/*
      # contrib/udev/* and not **/*: the doublestar form requires an intervening
      # directory, so it silently matched nothing for a flat directory and the
      # tarball shipped without the udev rules. contrib/systemd worked only
      # because it has user/ and system/ beneath it. A tarball install with no
      # rules file loses every sysfs grant on the next reboot — the same failure
      # as issue #12, reached a different way. goreleaser logs "no files matched"
      # rather than failing, so watch for that line in the release output.
      - contrib/udev/*

  - id: voltaire-gui
    ids: [voltaire-gui]
    formats: [tar.gz]
    name_template: "voltaire-gui_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - NOTICE
      # Inter is embedded into the binary with //go:embed, so the OFL notice
      # has to travel with every artifact, not just sit in the source tree.
      - internal/gui/fonts/LICENSE-Inter.txt
      - contrib/systemd/user/voltaire-gui.service
      - contrib/voltaire-gui.desktop
      - contrib/udev/99-voltaire-gamepad.rules

checksum:
  name_template: "checksums.txt"

nfpms:
  - id: voltaire-pkg
    package_name: voltaire
    section: utils
    formats:
      - archlinux
      - deb
      - rpm
    homepage: https://github.com/dahui/voltaire
    maintainer: "Jeff Hagadorn <noreply@github.com>"
    description: CLI and daemon for ASUS ROG Flow Z13 hardware control
    license: Apache-2.0
    dependencies:
      - systemd
      - dbus
    # provides/replaces/conflicts on the old name migrate .deb/.rpm installs;
    # AUR ignores replaces, which is what the AUR playbook (merge requests +
    # sticky comments) exists for.
    provides:
      - voltaire
      - z13ctl
    replaces:
      - z13ctl
    conflicts:
      - z13ctl
    scripts:
      postinstall: contrib/nfpm/postinstall.sh
      preremove: contrib/nfpm/preremove.sh
      postremove: contrib/nfpm/postremove.sh
    contents:
      - src: LICENSE
        dst: /usr/share/licenses/voltaire/LICENSE
      - src: contrib/systemd/user/voltaire.socket
        dst: /usr/lib/systemd/user/voltaire.socket
      - src: contrib/systemd/user/voltaire.service
        dst: /usr/lib/systemd/user/voltaire.service
      - src: contrib/systemd/system/voltaire-perms.service
        dst: /usr/lib/systemd/system/voltaire-perms.service
      - src: contrib/udev/99-voltaire.rules
        dst: /usr/lib/udev/rules.d/99-voltaire.rules
    archlinux:
      packager: "Jeff Hagadorn <noreply@github.com>"
    overrides:
      archlinux:
        suggests:
          - "ryzen_smu-dkms-git: CPU undervolting via Curve Optimizer"
    rpm:
      group: Applications/System

  - id: voltaire-gui-pkg
    package_name: voltaire-gui
    ids: [voltaire-gui]
    section: utils
    formats:
      - archlinux
      - deb
      - rpm
    homepage: https://github.com/dahui/voltaire
    maintainer: "Jeff Hagadorn <noreply@github.com>"
    description: GTK4 overlay GUI for voltaire hardware control
    license: Apache-2.0
    dependencies:
      - voltaire
      - gtk4
      - gtk4-layer-shell
    provides:
      - voltaire-gui
      - z13gui
    replaces:
      - z13gui
    conflicts:
      - z13gui
    scripts:
      postinstall: contrib/nfpm/gui-postinstall.sh
      preremove: contrib/nfpm/gui-preremove.sh
      postremove: contrib/nfpm/gui-postremove.sh
    contents:
      - src: LICENSE
        dst: /usr/share/licenses/voltaire-gui/LICENSE
      - src: NOTICE
        dst: /usr/share/licenses/voltaire-gui/NOTICE
      # The embedded typeface ships inside the binary, so its licence belongs
      # alongside the package's own.
      - src: internal/gui/fonts/LICENSE-Inter.txt
        dst: /usr/share/licenses/voltaire-gui/LICENSE-Inter.txt
      - src: contrib/systemd/user/voltaire-gui.service
        dst: /usr/lib/systemd/user/voltaire-gui.service
      - src: contrib/voltaire-gui.desktop
        dst: /usr/share/applications/voltaire-gui.desktop
      - src: contrib/udev/99-voltaire-gamepad.rules
        dst: /usr/lib/udev/rules.d/99-voltaire-gamepad.rules
    overrides:
      deb:
        dependencies:
          - voltaire
          - libgtk-4-1
          - libgtk4-layer-shell0
    archlinux:
      packager: "Jeff Hagadorn <noreply@github.com>"
    rpm:
      group: Applications/System

release:
  draft: false
  prerelease: auto
  # The annotated tag's message body becomes the top of the release notes,
  # followed by the auto-generated commit changelog. Write detailed notes with
  # `git tag -a vX.Y.Z` (opens an editor) or `git tag -a vX.Y.Z -F notes.md`.
  # Lightweight tags (no -a/-m) leave this empty and fall back to the changelog.
  header: |
    {{ .TagBody }}
