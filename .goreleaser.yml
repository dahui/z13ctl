version: 2

project_name: voltaire

# The api submodule is tagged api/vX.Y.Z in this same repository, and those tags
# land on commits well after the last main-module release. Without this filter
# goreleaser treats the newest api/* tag as the previous release and generates
# the changelog from that point — for v1.2.1 that meant a single commit instead
# of the whole bugfix series, silently truncating the GitHub release body.
#
# Verified by building v1.2.1 both ways in a scratch clone: 1 commit without,
# the full series with. Note it does NOT affect --snapshot versioning, which
# still derives from a plain `git describe`; the Makefile filters tags itself
# for the same reason.
git:
  ignore_tags:
    - "api/*"

before:
  hooks:
    - go mod tidy

builds:
  - id: voltaire
    binary: voltaire
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/dahui/voltaire/v2/internal/version.Version={{.Version}}
    goos:
      - linux
    goarch:
      - amd64
  - id: voltaire-gui
    binary: voltaire-gui
    main: ./voltaire-gui
    env:
      - CGO_ENABLED=1
    ldflags:
      - -s -w -X github.com/dahui/voltaire/v2/internal/version.Version={{.Version}}
    goos:
      - linux
    goarch:
      - amd64

archives:
  # One archive with both binaries, matching the single package: "voltaire" is
  # one application that happens to ship two executables, and a tarball user
  # should get the same thing a package user gets. A headless install simply
  # ignores voltaire-gui — the tarball imposes no GTK dependency.
  - id: voltaire
    ids: [voltaire, voltaire-gui]
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - NOTICE
      # Inter is embedded in voltaire-gui with //go:embed, so the OFL notice has
      # to travel with every artifact, not just sit in the source tree.
      - internal/gui/fonts/LICENSE-Inter.txt
      - contrib/systemd/**/*
      # contrib/udev/* and not **/*: the doublestar form requires an intervening
      # directory, so it silently matched nothing for a flat directory and the
      # tarball shipped without the udev rules. contrib/systemd works only
      # because it has user/ and system/ beneath it. A tarball install with no
      # rules file loses every sysfs grant on the next reboot — the same failure
      # as issue #12, reached a different way. goreleaser logs "no files matched"
      # rather than failing, so watch for that line in the release output.
      - contrib/udev/*
      - contrib/voltaire-gui.desktop

checksum:
  name_template: "checksums.txt"

nfpms:
  # ONE package, both binaries. The whole reason z13ctl and z13gui merged is
  # that the users who most need the GUI never discovered it as a separate
  # install; shipping it as a separate package would preserve exactly that
  # problem. One package also makes CLI/GUI version skew structurally
  # impossible. The cost is gtk4 + gtk4-layer-shell as hard dependencies of
  # every install, which is the right trade on a laptop/tablet that has them
  # already — a headless install can take the tarball and ignore the GUI
  # binary, which depends on nothing extra until it is run.
  - id: voltaire-pkg
    package_name: voltaire
    section: utils
    formats:
      - archlinux
      - deb
      - rpm
    homepage: https://github.com/dahui/voltaire
    maintainer: "Jeff Hagadorn <noreply@github.com>"
    description: RGB lighting, fan curve, TDP and system control for the ASUS ROG Flow Z13
    license: Apache-2.0
    dependencies:
      - systemd
      - dbus
      - gtk4
      - gtk4-layer-shell
    # Supersedes all four pre-2.0 names: this one package replaces both former
    # projects. AUR ignores replaces, which is what the AUR playbook (merge
    # requests + sticky comments) exists for.
    provides:
      - voltaire
      - voltaire-gui
      - z13ctl
      - z13gui
    replaces:
      - z13ctl
      - z13gui
    conflicts:
      - z13ctl
      - z13gui
    scripts:
      postinstall: contrib/nfpm/postinstall.sh
      preremove: contrib/nfpm/preremove.sh
      postremove: contrib/nfpm/postremove.sh
    contents:
      - src: LICENSE
        dst: /usr/share/licenses/voltaire/LICENSE
      - src: NOTICE
        dst: /usr/share/licenses/voltaire/NOTICE
      # The embedded typeface ships inside voltaire-gui, so its licence belongs
      # alongside the package's own.
      - src: internal/gui/fonts/LICENSE-Inter.txt
        dst: /usr/share/licenses/voltaire/LICENSE-Inter.txt
      - src: contrib/systemd/user/voltaire.socket
        dst: /usr/lib/systemd/user/voltaire.socket
      - src: contrib/systemd/user/voltaire.service
        dst: /usr/lib/systemd/user/voltaire.service
      - src: contrib/systemd/user/voltaire-gui.service
        dst: /usr/lib/systemd/user/voltaire-gui.service
      - src: contrib/systemd/system/voltaire-perms.service
        dst: /usr/lib/systemd/system/voltaire-perms.service
      - src: contrib/udev/99-voltaire.rules
        dst: /usr/lib/udev/rules.d/99-voltaire.rules
      - src: contrib/udev/99-voltaire-gamepad.rules
        dst: /usr/lib/udev/rules.d/99-voltaire-gamepad.rules
      - src: contrib/voltaire-gui.desktop
        dst: /usr/share/applications/voltaire-gui.desktop
      # Compatibility symlinks for the pre-2.0 command names, so scripts,
      # keybindings and cron jobs calling z13ctl or z13gui keep working across
      # the rename. Each binary notices it was invoked this way and prints a
      # deprecation line on stderr only — stdout stays byte-identical, which is
      # what a script parsing `z13ctl profile --get` depends on. Removed at 3.0.
      - src: /usr/bin/voltaire
        dst: /usr/bin/z13ctl
        type: symlink
      - src: /usr/bin/voltaire-gui
        dst: /usr/bin/z13gui
        type: symlink
    overrides:
      deb:
        dependencies:
          - systemd
          - dbus
          - libgtk-4-1
          - libgtk4-layer-shell0
      archlinux:
        suggests:
          - "ryzen_smu-dkms-git: CPU undervolting via Curve Optimizer"
    archlinux:
      packager: "Jeff Hagadorn <noreply@github.com>"
    rpm:
      group: Applications/System

release:
  draft: false
  prerelease: auto
  # The annotated tag's message body becomes the top of the release notes,
  # followed by the auto-generated commit changelog. Write detailed notes with
  # `git tag -a vX.Y.Z` (opens an editor) or `git tag -a vX.Y.Z -F notes.md`.
  # Lightweight tags (no -a/-m) leave this empty and fall back to the changelog.
  header: |
    {{ .TagBody }}
